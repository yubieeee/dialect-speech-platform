# 本文件列出常改字段；真正开训前请合并进完整 hyperpyyaml。

sample_rate: 24000
chunk_size: 25
num_decoding_left_chunks: -1

# ras_sampling
top_p: 0.8
top_k: 25
win_size: 10
tau_r: 0.1

# CFM
training_cfg_rate: 0.2
inference_cfg_rate: 0.7

# filter / batch
filter_max_length: 6000
filter_min_length: 100
token_max_length: 200
token_min_length: 1
shuffle_size: 1000
sort_size: 500
batch_type: dynamic
max_frames_in_batch: 2000
truncate_length: 24960
use_spk_embedding: true  # SFT 通常 True

train_conf:
  optim: adam
  optim_conf:
    lr: 1e-05
  scheduler: constantlr
  scheduler_conf:
    warmup_steps: 2500
  max_epoch: 1
  grad_clip: 5.0
  accum_grad: 2
  log_interval: 100
  save_per_step: -1

train_conf_gan:
  optim: adam
  optim_conf:
    lr: 0.0002
  scheduler: constantlr
  optim_d: adam
  optim_conf_d:
    lr: 0.0002
  scheduler_d: constantlr
  max_epoch: 1
  grad_clip: 5.0
  accum_grad: 1
  log_interval: 100
  save_per_step: -1

# meta
exp_name: smoke_export
data_instruct: "You are a helpful assistant.<|endofprompt|>"
note: ""
